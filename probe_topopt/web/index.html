<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>probe topopt</title>
  <!-- ブラウザが勝手に取りに行く /favicon.ico の404をログに残さないための空アイコン -->
  <link rel="icon" href="data:,">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; }
    canvas { display: block; width: 100%; height: 100%; }
    #run {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 10;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #556;
      border-radius: 4px;
      background: rgba(20, 24, 36, 0.9);
      color: #eef;
    }
    #run:disabled { opacity: 0.55; cursor: default; }
  </style>
  <script type="importmap">
  {"imports": {"three": "./vendor/three/three.module.js"}}
  </script>
</head>
<body>
  <button id="run" type="button">最適化を実行</button>
  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from './vendor/three/OrbitControls.js';

  // WebSocketのポート。**server.py 側を PROBE_WS_PORT で動かしたとき、ここが8776に
  // 固定だと画面だけ古いポートを叩いて黙って繋がらない**ので `?ws=<番号>` で上書きできる。
  // 既定が8776なのは、8765/8766を duocad 本体が使っているため。
  const WS_PORT = new URLSearchParams(location.search).get('ws') ?? '8776';
  const WS_URL = `ws://127.0.0.1:${WS_PORT}`;
  // **`?voxel=1` を付けたときだけ、完了時も従来のボクセル表示のまま終わる**(デバッグ用)。
  // 既定(付けない場合)は完了時に平滑化した面へ差し替わる。
  const VOXEL_ONLY = new URLSearchParams(location.search).get('voxel') === '1';
  // **`?debug=anchors` を付けたときは最適化を回さず、面アンカー(CADの面に割り当てた
  // 格子節点)を描く**。固定に割り当てた節点と荷重に割り当てた節点を別々の色で出す。
  const ANCHOR_DEBUG = new URLSearchParams(location.search).get('debug') === 'anchors';
  // 実機検査(shot_anchors.mjs)が「2色が本当に画面に出ているか」を数えるための基準色。
  const FIXED_COLOR = 0x2ee6a8;   // 固定 = 緑シアン
  const LOAD_COLOR = 0xff5c2e;    // 荷重 = 橙赤
  const runBtn = document.getElementById('run');

  const probe = {
    state: 'idle',
    lastIter: null,
    iterations: [],
    error: null,
    // 完了時にどちらの表示になったか。'voxel' | 'smooth' | null(未完了)。
    surface: null,
    // `?debug=anchors` のときだけ入る {fixed, load, design, fixedColor, loadColor}。
    anchors: null,
  };
  window.__probe = probe;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a12);

  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 5000);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 0.65));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
  dirLight.position.set(2, 3, 1);
  scene.add(dirLight);

  const dummy = new THREE.Object3D();
  let mesh = null;
  let smoothMesh = null;
  let designMesh = null;
  let fixedMesh = null;
  let loadMesh = null;
  let boundsHelper = null;
  let nelx = 0;
  let nely = 0;
  let nelz = 0;
  let maxIter = 0;
  let socket = null;

  function setProbeState(next) {
    probe.state = next;
  }

  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  /**
   * 設計空間がちょうど画面に収まる位置へカメラを置く。
   * **「格子の最大辺 × 係数」で決めない** —— 視野角と縦横比を無視した目分量になり、
   * 40x16x16 だと画面の1/6ほどの大きさにしか映らなかった(2026-08-29に実測)。
   * 外接球の半径から必要な距離を三角法で出す。
   */
  function fitCamera() {
    const radius = 0.5 * Math.hypot(nelx || 1, nely || 1, nelz || 1);
    const vFov = THREE.MathUtils.degToRad(camera.fov);
    const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
    const dist = Math.max(radius / Math.sin(vFov / 2), radius / Math.sin(hFov / 2)) * 1.08;
    camera.position.copy(new THREE.Vector3(0.72, 0.45, 0.86).normalize().multiplyScalar(dist));
    camera.near = dist / 100;
    camera.far = dist * 20;
    camera.updateProjectionMatrix();
    controls.target.set(0, 0, 0);
    controls.update();
  }

  function updateBounds() {
    if (boundsHelper) {
      scene.remove(boundsHelper);
      boundsHelper.geometry.dispose();
      boundsHelper.material.dispose();
      boundsHelper = null;
    }
    const boxGeo = new THREE.BoxGeometry(nelx, nely, nelz);
    const edges = new THREE.EdgesGeometry(boxGeo);
    boxGeo.dispose();
    boundsHelper = new THREE.LineSegments(
      edges,
      new THREE.LineBasicMaterial({ color: 0x5577aa, transparent: true, opacity: 0.45 }),
    );
    scene.add(boundsHelper);
    fitCamera();
  }

  function initMesh(nx, ny, nz) {
    nelx = nx;
    nely = ny;
    nelz = nz;
    if (mesh) {
      scene.remove(mesh);
      mesh.geometry.dispose();
      mesh.material.dispose();
      mesh = null;
    }
    if (smoothMesh) {
      scene.remove(smoothMesh);
      smoothMesh.geometry.dispose();
      smoothMesh.material.dispose();
      smoothMesh = null;
    }
    const maxCount = nelx * nely * nelz;
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshLambertMaterial();
    mesh = new THREE.InstancedMesh(geometry, material, maxCount);
    mesh.count = 0;
    mesh.visible = true;
    scene.add(mesh);
    updateBounds();
  }

  /**
   * 完了時、ボクセルの立方体描画を平滑化した三角形メッシュへ差し替える。
   * ボクセル(`mesh`)は消さずに`visible=false`で隠すだけにする —— `?voxel=1`のときは
   * この関数自体を呼ばないので、隠す/戻すの分岐が単純なままで済む。
   */
  function showSmoothMesh(payload) {
    if (smoothMesh) {
      scene.remove(smoothMesh);
      smoothMesh.geometry.dispose();
      smoothMesh.material.dispose();
      smoothMesh = null;
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(payload.vertices, 3),
    );
    // 頂点数は最大でも数万なので既定のUint16(65535上限)を超えうる —— 明示的にUint32にする。
    geometry.setIndex(new THREE.Uint32BufferAttribute(payload.faces, 1));
    geometry.computeVertexNormals();
    const material = new THREE.MeshLambertMaterial({ color: 0x6fa8dc });
    smoothMesh = new THREE.Mesh(geometry, material);
    scene.add(smoothMesh);
    if (mesh) mesh.visible = false;
  }

  function disposeMesh(m) {
    if (!m) return null;
    scene.remove(m);
    m.geometry.dispose();
    m.material.dispose();
    return null;
  }

  /**
   * `?debug=anchors`: 設計空間のボクセルを半透明で、固定/荷重に割り当てた節点を
   * **別々の色の球**で描く。
   *
   * 座標の規約: ボクセルは中心が `ex+0.5-nelx/2` に来るので(既存の updateInstances と
   * 同じ)、その角にある**節点は `i-nelx/2`**。サーバ側(`_build_anchor_payload`)で
   * 既にこの引き算を済ませて送ってくるので、ここでは足し引きしない ——
   * **両側で引くと二重にずれる。**
   */
  function showAnchors(msg) {
    nelx = msg.nelx;
    nely = msg.nely;
    nelz = msg.nelz;
    mesh = disposeMesh(mesh);
    smoothMesh = disposeMesh(smoothMesh);
    designMesh = disposeMesh(designMesh);
    fixedMesh = disposeMesh(fixedMesh);
    loadMesh = disposeMesh(loadMesh);

    // 設計空間は**不透明**に描く。半透明にすると重なりで silhouette が潰れ、
    // 耳(lug)のような小さな出っ張りが画面から消える(2026-08-31に実測)。
    designMesh = new THREE.InstancedMesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshLambertMaterial({ color: 0x39445e }),
      Math.max(msg.design.length, 1),
    );
    designMesh.count = msg.design.length;
    for (let i = 0; i < msg.design.length; i++) {
      const [ex, ey, ez] = flatToExyz(msg.design[i]);
      dummy.position.set(ex + 0.5 - nelx / 2, ey + 0.5 - nely / 2, ez + 0.5 - nelz / 2);
      dummy.updateMatrix();
      designMesh.setMatrixAt(i, dummy.matrix);
    }
    designMesh.instanceMatrix.needsUpdate = true;
    scene.add(designMesh);

    const nodeGeo = new THREE.SphereGeometry(0.34, 12, 8);
    const build = (flat, color) => {
      const count = flat.length / 3;
      // **節点は深度テストを切って最前面に描く。** どの節点が選ばれたかを見るための表示で、
      // 形状の裏側にある節点(固定面はカメラの反対側にある)まで見えている必要がある。
      const m = new THREE.InstancedMesh(
        nodeGeo.clone(),
        new THREE.MeshLambertMaterial({
          color, emissive: color, emissiveIntensity: 0.6, depthTest: false,
        }),
        Math.max(count, 1),
      );
      m.renderOrder = 3;
      m.count = count;
      for (let i = 0; i < count; i++) {
        dummy.position.set(flat[3 * i], flat[3 * i + 1], flat[3 * i + 2]);
        dummy.updateMatrix();
        m.setMatrixAt(i, dummy.matrix);
      }
      m.instanceMatrix.needsUpdate = true;
      scene.add(m);
      return m;
    };
    fixedMesh = build(msg.fixed, FIXED_COLOR);
    loadMesh = build(msg.load, LOAD_COLOR);
    nodeGeo.dispose();

    updateBounds();
    probe.anchors = {
      fixed: msg.fixed.length / 3,
      load: msg.load.length / 3,
      design: msg.design.length,
      fixedFace: msg.fixed_face,
      loadFace: msg.load_face,
      fixedArea: msg.fixed_area,
      loadArea: msg.load_area,
      seconds: msg.seconds,
      fixedColor: FIXED_COLOR,
      loadColor: LOAD_COLOR,
    };
  }

  /**
   * 画面に**2色が本当に出ているか**を数える(実機検査の穴)。
   * 直前に自分で1フレーム描いてから読むので `preserveDrawingBuffer` は要らない。
   * 「両方の節点集合を描いたつもりで、片方が形状の裏に隠れている/同じ色だった」を弾く。
   */
  probe.pixelCensus = () => {
    renderer.render(scene, camera);
    const gl = renderer.getContext();
    const w = gl.drawingBufferWidth;
    const h = gl.drawingBufferHeight;
    const buf = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    let fixed = 0;
    let load = 0;
    for (let i = 0; i < buf.length; i += 4) {
      const r = buf[i], g = buf[i + 1], b = buf[i + 2];
      if (g > 110 && g > 1.6 * r && g > 1.15 * b) fixed++;
      else if (r > 110 && r > 1.8 * g && r > 2.2 * b) load++;
    }
    return { width: w, height: h, fixed, load };
  };

  function flatToExyz(e) {
    const ez = e % nelz;
    const t = Math.floor(e / nelz);
    const ey = t % nely;
    const ex = Math.floor(t / nely);
    return [ex, ey, ez];
  }

  function densityColor(t) {
    const color = new THREE.Color();
    color.setHSL(0.58 - t * 0.38, 0.75, 0.12 + t * 0.58);
    return color;
  }

  function updateInstances(occupied, rhoVals) {
    if (!mesh) return;
    mesh.count = occupied.length;
    for (let i = 0; i < occupied.length; i++) {
      const [ex, ey, ez] = flatToExyz(occupied[i]);
      dummy.position.set(
        ex + 0.5 - nelx / 2,
        ey + 0.5 - nely / 2,
        ez + 0.5 - nelz / 2,
      );
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      mesh.setColorAt(i, densityColor(rhoVals[i] / 255));
    }
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) {
      mesh.instanceColor.needsUpdate = true;
    }
  }

  function handleMessage(msg) {
    if (msg.type === 'anchors') {
      showAnchors(msg);
      setProbeState('anchors');
      runBtn.disabled = false;
      runBtn.textContent =
        `面アンカー: 固定=面${msg.fixed_face} ${probe.anchors.fixed}節点 / ` +
        `荷重=面${msg.load_face} ${probe.anchors.load}節点`;
      if (socket) {
        socket.close();
        socket = null;
      }
      return;
    }
    if (msg.type === 'start') {
      maxIter = msg.max_iter;
      initMesh(msg.nelx, msg.nely, msg.nelz);
      runBtn.textContent = `反復 0/${maxIter}`;
      return;
    }
    if (msg.type === 'iter') {
      probe.lastIter = msg;
      probe.iterations.push(msg);
      updateInstances(msg.occupied, msg.rho);
      runBtn.textContent =
        `反復 ${msg.it}/${maxIter} · C=${msg.compliance.toFixed(1)}`;
      return;
    }
    if (msg.type === 'done') {
      setProbeState('done');
      runBtn.disabled = false;
      runBtn.textContent =
        `完了 ${msg.iterations}反復 · C=${msg.compliance.toFixed(2)} (もう一度)`;
      // **既定は完了時に平滑化した面へ差し替える。** `?voxel=1` のときだけ、デバッグ用に
      // 従来のボクセル表示のまま終わる(サーバがmeshを送ってこなかった=生成失敗のときも
      // 同じくボクセルのまま残す)。
      if (!VOXEL_ONLY && msg.mesh) {
        showSmoothMesh(msg.mesh);
        probe.surface = 'smooth';
      } else {
        probe.surface = 'voxel';
      }
      if (socket) {
        socket.close();
        socket = null;
      }
      return;
    }
    if (msg.type === 'error') {
      setProbeState('error');
      probe.error = msg.message;
      runBtn.disabled = false;
      runBtn.textContent = `エラー: ${msg.message}`;
      if (socket) {
        socket.close();
        socket = null;
      }
    }
  }

  if (ANCHOR_DEBUG) runBtn.textContent = '面アンカーを表示';

  runBtn.addEventListener('click', () => {
    if (probe.state === 'running') return;
    probe.error = null;
    probe.lastIter = null;
    probe.iterations = [];
    setProbeState('running');
    runBtn.disabled = true;
    runBtn.textContent = '接続中…';
    socket = new WebSocket(WS_URL);
    socket.addEventListener('open', () => {
      socket.send(JSON.stringify(
        ANCHOR_DEBUG ? { type: 'start', mode: 'anchors' } : { type: 'start' },
      ));
    });
    socket.addEventListener('message', (ev) => {
      handleMessage(JSON.parse(ev.data));
    });
    socket.addEventListener('error', () => {
      if (probe.state !== 'running') return;
      setProbeState('error');
      probe.error = 'WebSocket 接続に失敗しました';
      runBtn.disabled = false;
      runBtn.textContent = probe.error;
    });
    socket.addEventListener('close', () => {
      if (probe.state === 'running') {
        setProbeState('error');
        probe.error = '接続が切断されました';
        runBtn.disabled = false;
        runBtn.textContent = probe.error;
      }
      socket = null;
    });
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
    // **実機検査が「真っ黒でも合格」にならないようにする穴。** 直前のフレームで
    // GPUへ投げた三角形の数を出しておくと、shot.mjs がこれを見て空の画面を弾ける。
    probe.triangles = renderer.info.render.triangles;
  }
  animate();
  </script>
</body>
</html>
