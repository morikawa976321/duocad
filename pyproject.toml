[project]
name = "minicad"
version = "0.0.1"
description = "自作3DCAD minicad — M0: コアの骨格（文書・操作ログ・STEP入出力）"
requires-python = ">=3.11,<3.12"
dependencies = [
    "build123d==0.11.1",
    "cadquery-ocp-novtk==7.9.3.1.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minicad"]
