[project]
name = "duocad"
version = "0.0.1"
description = "自作3DCAD duocad — M0: コアの骨格（文書・操作ログ・STEP入出力）"
requires-python = ">=3.14,<3.15"
dependencies = [
    "build123d==0.11.1",
    "cadquery-ocp-novtk==7.9.3.1.1",
    # duocad/topopt/neck_persistence.py の完成形のくびれ検査(立方複体の持続ホモロジー)
    "gudhi==3.13.0",
    # duocad/topopt/finalize.py のメッシュ集合演算(保持を足し除外を引く)。Windows 用 wheel がある版
    "manifold3d==3.5.3",
    # topopt_checks/render_*.py の画像出力。pillow と scikit-image はこの版で topopt のテストが通る(2026-09-18 実測)
    "pillow==12.3.0",
    "pytest>=8.0",
    # duocad/topopt/mesh.py の marching_cubes
    "scikit-image==0.26.0",
    # M1: duocad/server.py の WebSocket。固定版で入れる(ローカル専用ツールなので上げなければ壊れない)
    "websockets==17.0.1",
]

[project.optional-dependencies]
# duocad/topopt/gpu_cg.py(形状最適化の CG を GPU で解く経路)。使う機械だけ `uv sync --extra gpu` で入れ、
# 画面の「設定」の「GPU で計算する」で有効にする(docs/TOPOPT_GPU.md)。[ctk] で CUDA ランタイムも wheel で入り、
# システムへの CUDA Toolkit は要らない。NVIDIA の GPU が無い機械では入れない。
gpu = [
    "cupy-cuda13x[ctk]==14.2.0; sys_platform == 'win32' or sys_platform == 'linux'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# duocad は venv へインストールしていないので、rootdir を sys.path に入れる。
# これが無いと `python -m pytest`（CWDがsys.pathに入る）でしか走らず、素の `pytest` では
# `ModuleNotFoundError: No module named 'duocad'` で収集エラーになる（実測）。
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["duocad"]
